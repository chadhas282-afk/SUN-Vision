<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUN Vision · NumPy Neural Network</title>
  <meta name="description" content="Draw numbers and let SUN Vision's pure NumPy neural network predict them.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #080810;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.09);
      --purple:  #ff6b00;
      --cyan:    #ffcc00;
      --text:    #f1f0ff;
      --muted:   rgba(255,255,255,0.4);
      --radius:  20px;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(255,107,0,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(255,204,0,0.1) 0%, transparent 60%);
    }

    
    header { text-align: center; padding: 2.5rem 1rem 1.5rem; }
    .badge {
      display: inline-block;
      padding: 0.3rem 0.9rem;
      border-radius: 100px;
      background: rgba(255,107,0,0.15);
      border: 1px solid rgba(255,107,0,0.35);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffaa00;
      margin-bottom: 0.9rem;
      font-family: 'JetBrains Mono', monospace;
    }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 900;
      background: linear-gradient(135deg, #fff 10%, #ffcc00 60%, #ff4500 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .sub { margin-top: 0.5rem; color: var(--muted); font-size: 0.9rem; }

    
     main {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 0 1.25rem 3rem;
      width: 100%;
      max-width: 1200px;
      align-items: center;
    }

    .panel {
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
    }
    .panel-title {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
      font-family: 'JetBrains Mono', monospace;
    }

    
    .draw-panel { flex: 0 0 auto; width: 100%; max-width: 1020px; display: flex; flex-direction: column; align-items: center; }

    #drawCanvas {
      display: block;
      width: 100%; max-width: 960px; height: auto;
      aspect-ratio: 960 / 280;
      background: #080808;
      border-radius: 14px;
      border: 1.5px solid rgba(124,58,237,0.25);
      cursor: crosshair;
      touch-action: none;
      box-shadow: 0 0 40px rgba(124,58,237,0.08) inset;
      transition: border-color 0.3s;
    }
    #drawCanvas.active { border-color: rgba(124,58,237,0.55); }

    .brush-row {
      display: flex; align-items: center; gap: 0.7rem;
      margin-top: 0.9rem; color: var(--muted); font-size: 0.78rem;
      width: 100%; max-width: 960px;
    }
    input[type=range] {
      flex: 1; height: 4px; -webkit-appearance: none;
      background: rgba(255,255,255,0.1); border-radius: 2px; outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--purple); cursor: pointer;
      box-shadow: 0 0 8px rgba(124,58,237,0.7);
    }
    #brushVal { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; min-width: 2.5rem; text-align: right; }
